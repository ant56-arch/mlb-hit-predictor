name: NBA smoke test (temporary)
on:
  push:
    branches: [claude/nba-site-ztxqk4]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Live ESPN endpoints
        working-directory: nba
        run: |
          python - <<'PY'
          import espn
          inj = espn.injuries(); print("injury teams", len(inj), "entries", sum(len(v) for v in inj.values()))
          g = espn.scoreboard("2026-06-05"); print("finals day", g)
          b = espn.boxscore(g[0]["id"]); print({t: len(v["players"]) for t, v in b.items()})
          print("today", espn.scoreboard(__import__("datetime").date.today().isoformat()))
          PY
      - name: NBA pipeline as the daily run would
        run: python nba/predict.py && git status --short
      - name: NBA pipeline replaying the last week of the Finals
        run: |
          echo '{"through": "2026-06-01"}' > nba/data/sync.json
          NBA_TODAY=2026-06-08 python nba/predict.py && git status --short && cat nba/data/sync.json
      - name: Build
        run: python build_site.py && python nba/build_pages.py && ls -R dist | head -30 && cat dist/nba/summary.json
