name: Merge and Analyze Research Data

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run merge and analysis
        run: python research/merge_and_analyze.py

      - name: Commit combined data
        run: |
          git config user.name "BTS Edge Bot"
          git config user.email "bot@btsedge.com"
          git add combined_gamelogs.json || true
          git diff --staged --quiet || git commit -m "Add combined analysis data"
          git push || true
