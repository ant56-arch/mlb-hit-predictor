name: Research Data Pull + Retrain

# Pulls a full season of game-by-game data and refits the hit-probability
# model on it. Run by hand, ideally once after each regular season ends.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to pull (blank = current year)"
        required: false
      cutoff_date:
        description: "Last date to include, YYYY-MM-DD (blank = whole season)"
        required: false

jobs:
  pull_and_train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r research/requirements.txt

      - name: Pull season data
        env:
          SEASON: ${{ inputs.season }}
          CUTOFF_DATE: ${{ inputs.cutoff_date }}
        run: python research/pull_season_data.py

      - name: Retrain model
        run: python research/train_model.py

      - name: Commit data and model
        run: |
          git config user.name "MLB Edge Bot"
          git config user.email "actions@github.com"
          git add research_gamelogs.json model_weights.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh research data and retrain model"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
