name: MLB Edge Daily

# Picks runs refresh today's picks; later runs see posted lineups, and picks
# lock once their game starts. The 2am run grades yesterday's picks. Every run
# also runs NBA Edge (nba/predict.py), which stores finished games, grades and
# refreshes its picks on every run whatever the mode. Every run rebuilds both
# sites and (on main) publishes them to GitHub Pages.
# Times are ET converted to UTC assuming EDT (UTC-4); they run an hour early
# in EST, which only affects the offseason.

on:
  schedule:
    - cron: '0 15 * * *'    # 11:00am ET - picks (day-game lineups are up)
    - cron: '0 20 * * *'    # 4:00pm ET  - picks (most night lineups are up)
    - cron: '30 22 * * *'   # 6:30pm ET  - picks (West Coast lineups)
    - cron: '0 6 * * *'     # 2:00am ET  - grade results
  workflow_dispatch:
    inputs:
      mode:
        description: "picks or results"
        type: choice
        options: [picks, results]
        default: picks

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mlb-edge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MODE: ${{ github.event.schedule == '0 6 * * *' && 'results' || inputs.mode || 'picks' }}
        run: python predict.py

      # NBA Edge (nba/) rides the same schedule. Its steps can't block MLB Edge.
      - name: Run NBA pipeline
        continue-on-error: true
        run: python nba/predict.py

      - name: Commit picks history
        run: |
          git config user.name "MLB Edge Bot"
          git config user.email "actions@github.com"
          git add picks_history.json nba/picks_history.json nba/data/
          git diff --staged --quiet && exit 0
          git commit -m "Update picks history $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Build site
        run: python build_site.py

      - name: Build NBA site
        continue-on-error: true
        run: python nba/build_pages.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
