name: Daily MLB Hit Predictions

on:
  schedule:
    - cron: '0 12 * * *'   # 8am ET (12pm UTC during EDT)
    - cron: '0 20 * * *'   # 4pm ET (8pm UTC during EDT)
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction model
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: anthonytrotta56@gmail.com
          RUN_HOUR_ET: ${{ github.event.schedule == '0 20 * * *' && '16' || '8' }}
        run: python predict.py
